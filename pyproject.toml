[project]
name = "drowsy-eeg"
version = "0.1.0"
description = "Detect drowsiness (sleep stage 1) from single-channel EEG with FFT band-power features"
requires-python = ">=3.10"
dependencies = ["mne>=1.6", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["drowsy_eeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
